services:
  dnsguard:
    build: .
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "127.0.0.1:8053:8053"     # dashboard: keep it local, or put a reverse proxy + token in front
    # binding port 53 as a non-root user inside the container
    cap_add: [NET_BIND_SERVICE]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 53
    environment:
      DNSGUARD_TOKEN: change-me
    command:
      - -upstream=https://cloudflare-dns.com/dns-query
      - -upstream=https://dns.quad9.net/dns-query
      - -block=https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
      - -block=/lists/extra.txt
      - -allow=/lists/allow.txt
    volumes:
      - ./lists:/lists:ro
